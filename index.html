<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Live Spreadsheet</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style type="text/tailwindcss">
        @layer components {
            .cell-input { @apply w-full bg-transparent border-none outline-none px-4 py-3 text-sm focus:bg-indigo-50/50 rounded-lg transition-all; }
            .mobile-label { @apply block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1 ml-4 md:hidden; }
        }
        @media (max-width: 640px) {
            .responsive-stack { display: block !important; }
            .responsive-stack thead { display: none; }
            .responsive-stack tr { @apply block mb-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 relative; }
            .responsive-stack td { @apply block mb-4 p-0 !important; }
            .responsive-stack tfoot td { @apply mb-3 bg-indigo-50/50 rounded-xl p-4 flex justify-between items-center text-indigo-700 font-bold !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyBrh0z8r1ybxlzV0yWUx73lPrmuXfFIdxg",
            authDomain: "generic-speadsheet.firebaseapp.com",
            projectId: "generic-speadsheet",
            storageBucket: "generic-speadsheet.firebasestorage.app",
            messagingSenderId: "800568931914",
            appId: "1:800568931914:web:1138e5599e80660cd218b3",
            measurementId: "G-YRBL3LJVM3"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const DOC_REF = db.collection("data").doc("main_sheet");

        function App() {
            const [columns, setColumns] = useState([]);
            const [rows, setRows] = useState([]);
            const [status, setStatus] = useState("Connecting...");

            // 1. Real-time Listener (The "React" Magic)
            useEffect(() => {
                const unsubscribe = DOC_REF.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        // Only update state if change came from elsewhere to prevent cursor flickers
                        if (!doc.metadata.hasPendingWrites) {
                            setColumns(data.columns || []);
                            setRows(JSON.parse(data.rowsString || "[]"));
                        }
                        setStatus("Live Sync");
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Sync function
            const syncToCloud = (newCols, newRows) => {
                setStatus("Saving...");
                DOC_REF.set({
                    columns: newCols,
                    rowsString: JSON.stringify(newRows)
                }).then(() => setStatus("Live Sync"))
                  .catch(() => setStatus("Error"));
            };

            // 3. Actions
            const addColumn = () => {
                const nextCols = [...columns, "New Column"];
                const nextRows = rows.map(r => [...r, ""]);
                setColumns(nextCols);
                setRows(nextRows);
                syncToCloud(nextCols, nextRows);
            };

            const addRow = () => {
                const nextRows = [...rows, new Array(columns.length).fill("")];
                setRows(nextRows);
                syncToCloud(columns, nextRows);
            };

            const deleteRow = (idx) => {
                const nextRows = rows.filter((_, i) => i !== idx);
                setRows(nextRows);
                syncToCloud(columns, nextRows);
            };

            const deleteColumn = (idx) => {
                const nextCols = columns.filter((_, i) => i !== idx);
                const nextRows = rows.map(r => r.filter((_, i) => i !== idx));
                setColumns(nextCols);
                setRows(nextRows);
                syncToCloud(nextCols, nextRows);
            };

            const handleCellChange = (rIdx, cIdx, val) => {
                const nextRows = [...rows];
                nextRows[rIdx][cIdx] = val;
                setRows(nextRows);
                syncToCloud(columns, nextRows);
            };

            const getTally = (cIdx) => {
                const total = rows.reduce((sum, row) => {
                    const val = parseFloat(row[cIdx]?.toString().replace(/,/g, ''));
                    return !isNaN(val) ? sum + val : sum;
                }, 0);
                return total === 0 ? "-" : total.toLocaleString();
            };

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-10">
                    <header className="flex justify-between items-end mb-8">
                        <div>
                            <h1 className="text-2xl font-black text-slate-800 tracking-tight">Live Workspace</h1>
                            <div className="flex items-center gap-2 mt-1">
                                <span className={`w-2 h-2 rounded-full ${status === 'Error' ? 'bg-red-500' : 'bg-green-500'}`}></span>
                                <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-500">{status}</span>
                            </div>
                        </div>
                        <button onClick={() => syncToCloud(["Item", "Cost"], [["", ""]])} className="text-slate-300 hover:text-red-500">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </header>

                    <div className="grid grid-cols-2 gap-3 mb-8">
                        <button onClick={addColumn} className="bg-white border border-slate-200 text-slate-600 py-3 rounded-xl text-sm font-bold shadow-sm active:scale-95 transition-all text-center">+ Column</button>
                        <button onClick={addRow} className="bg-indigo-600 text-white py-3 rounded-xl text-sm font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all text-center">+ Row</button>
                    </div>

                    <div className="md:bg-white md:rounded-3xl md:shadow-xl md:border md:border-slate-200 md:overflow-hidden">
                        <table className="w-full border-collapse responsive-stack">
                            <thead className="bg-slate-50 border-b border-slate-100">
                                <tr>
                                    {columns.map((col, i) => (
                                        <th key={i} className="group border-r border-slate-50 min-w-[150px]">
                                            <div className="flex items-center px-4 py-3">
                                                <input 
                                                    className="bg-transparent border-none outline-none font-bold text-[10px] uppercase tracking-widest text-slate-400 w-full"
                                                    value={col}
                                                    onChange={(e) => {
                                                        const next = [...columns];
                                                        next[i] = e.target.value;
                                                        setColumns(next);
                                                        syncToCloud(next, rows);
                                                    }}
                                                />
                                                <button onClick={() => deleteColumn(i)} className="text-slate-200 hover:text-red-500 ml-1">×</button>
                                            </div>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {rows.map((row, rIdx) => (
                                    <tr key={rIdx} className="group relative">
                                        {row.map((cell, cIdx) => (
                                            <td key={cIdx} className="md:border-r md:border-slate-50 relative" data-label={columns[cIdx]}>
                                                <span className="mobile-label">{columns[cIdx]}</span>
                                                <input 
                                                    className="cell-input"
                                                    value={cell}
                                                    onChange={(e) => handleCellChange(rIdx, cIdx, e.target.value)}
                                                />
                                                {cIdx === 0 && (
                                                    <button 
                                                        onClick={() => deleteRow(rIdx)}
                                                        className="absolute top-4 right-4 md:left-2 md:top-1/2 md:-translate-y-1/2 md:opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-all"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                )}
                                            </td>
                                        ))}
                                    </tr>
                                ))}
                            </tbody>
                            <tfoot className="md:bg-slate-50 border-t-2 border-slate-100">
                                <tr>
                                    {columns.map((_, i) => (
                                        <td key={i} className="text-center py-5 text-sm font-black text-indigo-600 md:border-r md:border-slate-100">
                                            <span className="mobile-label">Total {_}</span>
                                            {getTally(i)}
                                        </td>
                                    ))}
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
